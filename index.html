<!DOCTYPE html>
    <head>
        <title>Calculadora</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="estilo.css">
        <link rel="javascript" href="Funtio.js">
    </head>
    <body>
<!-- ×≤←√÷--->
            <div id="caja">
        <form name="Calculadora">
            <input type="textfield" name="pantalla" autocomplete="off" readonly><br>
            <input type="button" value="7" onclick="agregar('7')" class="yellow">
            <input type="button" value="8" onclick="agregar('8')" class="yellow">
            <input type="button" value="9" onclick="agregar('9')" class="yellow">
            <input type="button" value="+" onclick="agregar('+')" class="purple"><br>

            <input type="button" value="4" onclick="agregar('4')" class="yellow">
            <input type="button" value="5" onclick="agregar('5')" class="yellow">
            <input type="button" value="6" onclick="agregar('6')" class="yellow">
            <input type="button" value="-" onclick="agregar('-')" class="purple"><br>

            <input type="button" value="1" onclick="agregar('1')" class="yellow">
            <input type="button" value="2" onclick="agregar('2')" class="yellow">
            <input type="button" value="3" onclick="agregar('3')" class="yellow">
            <input type="button" value="×" onclick="agregar('*')" class="purple"><br>

            <input type="reset" value="C" class="purple">
            <input type="button" value="0" onclick="agregar('0')" class="purple">
            <input type="button" value="=" onclick="calcular()" class="purple">
            <input type="button" value="÷" onclick="agregar('/')" class="purple">
        </form>
    </div>

    <script src="JS.js"></script>

    </body>
</html>
